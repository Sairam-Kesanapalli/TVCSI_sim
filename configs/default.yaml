# TVCSI simulator — every tunable parameter lives here. Nothing numeric is hard-coded in src/.
# Notation follows the formulation document (Eqs. 1-39) and the task spec.

models: dummy              # dummy | trained
trained:                   # used only when models == trained; dotted paths "package.module:ClassName"
  encoder: null
  decoder: null
  predictor: null
  kwargs: {}               # passed to every trained-model constructor

system:
  K: 8                     # users
  M: 32                    # gNB antennas (ULA, half-wavelength spacing)
  B: 32                    # DFT codebook size

channel:
  source: synthetic        # synthetic | deepmimo (deepmimo loader is a stub)
  P: 3                     # propagation paths per user
  fc_hz: 3.5e+9            # carrier frequency
  Ts_s: 1.0e-3             # slot duration
  speed_kmh: 30.0          # user speed (all users)
  c_theta: 2.0e-4          # angular random-walk std per slot = c_theta * speed_kmh [rad]

link:
  snr_db: 15.0             # transmit SNR; aligned single-path beam gives gamma ~= snr_db
  pilot_snr_offset_db: 5.0 # pilot SNR = snr_db + offset
  eps: 1.0e-9              # Eq. 15 regularizer

quality:                   # task quality Q_k(gamma) (Eq. 20)
  model: measured          # measured: Q = 1 - BLER from data/q_curves.csv (Phase 2) | logistic: legacy spec 3.6
  curves: data/q_curves.csv  # written by `python scripts/measure_q.py curves`
  gamma0_db:               # legacy logistic only: Q = 1 / (1 + exp(-(gamma_dB - gamma0_type)/s))
    critical: 14.0
    normal: 10.0
    background: 6.0
  s_db: 1.5                # legacy logistic only
  q_min: 0.8               # Q_min for critical users (Eq. 34); with measured Q: BLER <= 0.2

radio:                     # the downlink data channel (PDSCH) that carries each user's semantic message.
                           # It fixes which measured Q curve a user gets AND the payload check of Eq. 39i.
  carrier_prbs: 270        # 50 MHz at 15 kHz SCS (3GPP TS 38.101-1 Table 5.3.2-1); chosen by
                           #   `scripts/measure_q.py select` (rule and result in ASSUMPTIONS.md, data/carrier_selection.csv)
  prb_hz: 180.0e+3         # 12 subcarriers x 15 kHz (TS 38.211); each user gets floor(carrier_prbs / K) PRBs
  pdsch_symbols: 12        # OFDM symbols 2-13 of the 14-symbol slot carry PDSCH (symbols 0-1: PDCCH CORESET)
  dmrs_re_per_prb: 12      # one front-loaded DMRS symbol per slot, no data on its 12 REs
  mcs_table: 1             # PDSCH MCS table 1, QPSK..64QAM (TS 38.214 Table 5.1.3.1-1), the default table
  payload_bytes:           # semantic payload per message type, 3GPP TS 22.185 R-5.2.2-001 / -002 (V2X)
    critical: 1200         #   event-triggered messages: up to 1200 bytes
    normal: 300            #   periodic broadcast messages: 50-300 bytes (upper end)
    background: 50         #   periodic broadcast messages: 50-300 bytes (lower end)

link_level:                # scripts/measure_q.py only (Sionna 5G NR link-level simulation)
  bp_iterations: 20        # LDPC belief-propagation iterations
  batch: 100               # transport blocks per Monte-Carlo batch
  min_errors: 100          # a point runs until this many block errors ...
  max_blocks: 1000         # ... or this many blocks (BLER resolution 1e-3)
  stop_bler: 2.0e-3        # the refined grid ends at the first point below this BLER
  snr_step_db: 0.25
  snr_min_db: -15.0
  snr_max_db: 40.0
  seed: 7                  # base seed; each curve uses seed + crc32(curve key) % 1e5 (order-independent)
  parts_dir: data/q_curves_parts   # each finished curve is saved here at once; a rerun skips saved curves
  carrier_candidates: [106, 133, 160, 216, 270]   # 20, 25, 30, 40, 50 MHz at 15 kHz SCS (TS 38.101-1 Table 5.3.2-1)
  feasibility_target: 0.90 # carrier rule: critical message deliverable with the true best beam in >= 90% of slots
  select:                  # coarser settings for the carrier selection step
    min_errors: 50
    max_blocks: 500
    snr_step_db: 0.5
    stop_bler: 1.0e-2

constraints:               # evaluation-only constraints and penalties of problem P1 (Eq. 39); never seen by a scheme
  eps_violation: 0.10      # epsilon_k of Eqs. 34 / 39j. 3GPP TS 38.214 5.2.2.1: CQI is chosen for a target
                           # transport-block error probability of 0.1 (CQI tables 1, 2, 4)
  payload_check_scale: 1.0 # multiplies radio.payload_bytes in the Eq. 39i Shannon check only (sensitivity)
  lambda_F: 1.0e-3         # Eq. 39a weight of feedback bits per slot. No standard value exists for the
  lambda_B: 0.05           #   three lambdas; the defaults make each term of the same order as the
  lambda_R: 0.10           #   utility, and every conclusion is re-checked over the sensitivity grid below.
  sensitivity:             # scripts/sensitivity.py: re-evaluate the constraints at these values
    eps: [0.01, 0.05, 0.10]
    payload_scale: [0.25, 0.5, 1.0, 2.0]   # multiplies every payload in the 39i check (not the Q curves)
    lambda_F: [0.0, 5.0e-4, 1.0e-3, 2.0e-3]
    lambda_B: [0.0, 0.05, 0.10]
    lambda_R: [0.0, 0.10, 0.20]

importance:
  crit_share: 0.25
  low_range: [0.05, 0.3]
  high_range: [0.7, 1.0]
  p_low_to_high: 0.10      # non-critical users
  p_high_to_low: 0.30
  p_low_to_high_crit: 0.15 # critical users
  p_high_to_low_crit: 0.20

feedback:
  code_len: [8, 16, 32]    # d_m for m = 1..3
  bits_per_value: 4        # => C = [0, 32, 64, 128] bits
  budget_frac: 0.25        # C_FB_max = budget_frac * K * C_3
  history_len: 8           # L_h, slots of channel history handed to the encoder

dummy:
  sigma_m: [0.8, 0.4, 0.15] # log-normal decoding error per mode m = 1..3
  tau: auto                # predictor confidence time constant: auto => 1/(1 - rho(speed)); or a number

tvcsi:
  n_bins: 10               # confidence quantile bins
  eps: 1.0e-9              # Eq. 32 regularizer
  table_path: results/tvcsi_table.json
  refit_per_point: true    # fit a table on validation seeds at every sweep point (see ASSUMPTIONS.md)
  fit_p0: [0.5, 0.9, 0.98] # random-mode policies used for fitting: P(mode 0); others uniform over 1..3

estimator:                 # S4: learned per-mode quality estimator used by Optimised / Proposed (src/tvcsi/estimator.py)
  cache_dir: results/estimators  # frozen model cached as estimator_<hash>.joblib (+ .json report); rebuilt if missing
  fit_p0: [0.5, 0.75, 0.9, 0.98] # exploration policies: P(mode 0), otherwise a uniform mode in 1..M_f (spreads the age)
  slot_stride: 16          # keep every 16th slot of each run (consecutive slots are strongly correlated)
  seeds_per_config: 4      # seeds per training configuration, cycled through seeds.train / seeds.val
  train_grid:              # default point + one-at-a-time variations (the sweep values), all on TRAIN seeds
    channel.speed_kmh: [3, 10, 20, 40, 60]
    link.snr_db: [5, 10, 20, 25]
    system.K: [2, 4, 6, 12, 16]
  age_cap: 200             # feedback age in the features is capped here (never fed back -> age_cap)
  n_estimators: 40         # ExtraTrees forest size
  min_samples_leaf: [25, 50, 100]  # candidates, chosen on the VALIDATION seeds
  max_features: 0.8
  random_state: 17

baseline:
  kind: periodic           # periodic | snr_threshold (what the 'Baseline' curve means)
  m_fixed: 2

sim:
  T: 2000
  warmup: 100
  n_jobs: 0                # 0 => all CPU cores

seeds:
  test: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]
  val: [2000, 2001, 2002, 2003, 2004]
  train: [3000, 3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008, 3009,
          3010, 3011, 3012, 3013, 3014, 3015, 3016, 3017, 3018, 3019]

metrics:
  cvar_alpha: 0.95

schemes:
  main: [Exact, Optimised, Proposed, Baseline]
  supplementary: [prediction_only, importance_only, snr_threshold, full_feedback,
                  Proposed_no_importance, Proposed_plugin, Optimised_plugin]

sweeps:
  budget:         {param: feedback.budget_frac, values: [0.05, 0.1, 0.2, 0.3, 0.5, 0.75, 1.0]}
  users:          {param: system.K,             values: [2, 4, 6, 8, 12, 16]}
  speed:          {param: channel.speed_kmh,    values: [3, 10, 20, 30, 40, 60]}
  critical_share: {param: importance.crit_share, values: [0.0, 0.1, 0.25, 0.5, 0.75]}
  snr:            {param: link.snr_db,          values: [5, 10, 15, 20, 25]}
  bits_target_frac: 0.9    # fig 10: fraction of full_feedback utility to reach

runtime:
  K_values: [2, 4, 6, 8, 10, 12, 16]
  brute_force_max_K: 10
  n_instances: 50          # random decision instances per seed and K
  n_seeds: 10

paths:
  results: results
  figures: figures

plots:
  dpi: 200
